<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="csShieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="50%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="csBoomGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
  </defs>

  <!-- Outer Rounded Hexagon Shield (Metallurgy & Dam Resilience) -->
  <path
    d="M64 8 L114 35 V93 L64 120 L14 93 V35 L64 8 Z"
    fill="url(#csShieldGrad)"
    stroke="#ffffff"
    stroke-width="4"
    stroke-linejoin="round"
  />

  <!-- Inner White Ring / Radar Sensor Pulse -->
  <circle cx="64" cy="64" r="38" stroke="#ffffff" stroke-opacity="0.3" stroke-width="2.5" stroke-dasharray="6 5" />

  <!-- Reservoir Hydrodynamic Waves (Waduk Cirata) -->
  <path
    d="M28 74 Q46 64, 64 74 T100 74"
    stroke="#e0f2fe"
    stroke-width="6"
    stroke-linecap="round"
    fill="none"
  />
  <path
    d="M34 88 Q49 79, 64 88 T94 88"
    stroke="#7dd3fc"
    stroke-width="5"
    stroke-linecap="round"
    fill="none"
  />

  <!-- Angled Deflection Trash Boom (θ = 35°) & IWRC SS304 Cable -->
  <line
    x1="32"
    y1="62"
    x2="96"
    y2="38"
    stroke="url(#csBoomGrad)"
    stroke-width="9"
    stroke-linecap="round"
  />

  <!-- Sacrificial Anode / Telemetry Sensor Nodes along the Boom -->
  <circle cx="42" cy="58" r="5.5" fill="#ffffff" stroke="#047857" stroke-width="2.5" />
  <circle cx="64" cy="50" r="6.5" fill="#fef08a" stroke="#b45309" stroke-width="2.5" />
  <circle cx="86" cy="42" r="5.5" fill="#ffffff" stroke="#0284c7" stroke-width="2.5" />
</svg>
