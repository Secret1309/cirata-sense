<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" fill="none">
  <defs>
    <marker id="flowArrowEmerald" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#059669" />
    </marker>
    <marker id="flowArrowAmber" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#d97706" />
    </marker>
    <marker id="flowArrowCyan" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#0284c7" />
    </marker>
  </defs>

  <!-- Pure White Canvas -->
  <rect width="1200" height="760" rx="20" fill="#ffffff" />
  <rect x="8" y="8" width="1184" height="744" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" />

  <!-- Top Header Banner (White & Light Amber/Emerald) -->
  <rect x="28" y="24" width="1144" height="70" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="48" y="52" font-family="ui-monospace, monospace" font-size="13" font-weight="800" fill="#b45309" letter-spacing="1">
    MODUL 01 (OSEANOGRAFI SPASIO-TEMPORAL) &amp; MODUL 04 (SIRKULARITAS 100.000 KJA &amp; MUTU AIR)
  </text>
  <text x="48" y="78" font-family="system-ui, sans-serif" font-size="20" font-weight="900" fill="#0f172a">
    Alur Sirkularitas Pemanenan Pasif, Pelet Pakan KJA &amp; Pemulihan Baku Mutu Air PP 22/2021
  </text>
  <rect x="920" y="38" width="232" height="42" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5" />
  <text x="1036" y="56" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" font-weight="800" fill="#92400e">
    PRODUKSI PAKAN SIRKULAR
  </text>
  <text x="1036" y="72" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" font-weight="900" fill="#b45309">
    48 TON/HARI (100.000 KJA)
  </text>

  <!-- ======================================================================= -->
  <!-- TOP ROW: 4 INTEGRATED PROCESS STAGES (WHITE CARDS)                      -->
  <!-- ======================================================================= -->

  <!-- STAGE 1: Dinamika Spasio-Temporal & Drift (Modul 1) -->
  <g transform="translate(28, 114)">
    <rect width="265" height="288" rx="14" fill="#ffffff" stroke="#0284c7" stroke-width="2" />
    <rect x="16" y="16" width="233" height="32" rx="6" fill="#e0f2fe" />
    <text x="132" y="36" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11.5" font-weight="900" fill="#0369a1">
      TAHAP 1 • MODUL 1 OSEANOGRAFI
    </text>
    <text x="132" y="70" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#0f172a">
      Dinamika Tutupan &amp; Drift
    </text>
    <rect x="18" y="84" width="229" height="44" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
    <text x="132" y="103" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" font-weight="800" fill="#0369a1">
      dA/dt = r·A(t) - H(t)
    </text>
    <text x="132" y="120" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#475569">
      v_drift = 0,85·v_inflow + 0,03·v_wind
    </text>

    <g font-family="ui-monospace, monospace" font-size="10.5" fill="#334155" font-weight="600">
      <text x="22" y="152">• Luas Waduk: <tspan fill="#0369a1" font-weight="800">6.200 ha</tspan></text>
      <text x="22" y="174">• Tutupan Awal A₀: <tspan fill="#b45309" font-weight="800">430 ha</tspan></text>
      <text x="22" y="196">• Laju Tumbuh r: <tspan fill="#be123c" font-weight="800">0,03/hari</tspan></text>
      <text x="22" y="218">• Tumbuh Alami: <tspan fill="#be123c" font-weight="800">+12,90 ha/hr</tspan></text>
      <text x="22" y="240">• Kuota DSS H(t): <tspan fill="#047857" font-weight="800">16,0 ha/hr</tspan></text>
      <text x="22" y="264" fill="#047857" font-weight="900">→ Reduksi Net: -3,10 ha/hari</text>
    </g>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="295" y1="258" x2="318" y2="258" stroke="#0284c7" stroke-width="4" marker-end="url(#flowArrowCyan)" />

  <!-- STAGE 2: Penggiringan Pasif & Collection Bay (Modul 2 & 3) -->
  <g transform="translate(322, 114)">
    <rect width="265" height="288" rx="14" fill="#ffffff" stroke="#059669" stroke-width="2" />
    <rect x="16" y="16" width="233" height="32" rx="6" fill="#d1fae5" />
    <text x="132" y="36" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11.5" font-weight="900" fill="#065f46">
      TAHAP 2 • DEFLEKSI &amp; PANEN
    </text>
    <text x="132" y="70" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#0f172a">
      Collection Bay Tepi Waduk
    </text>
    <rect x="18" y="84" width="229" height="44" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
    <text x="132" y="103" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" font-weight="800" fill="#047857">
      F_T = F_D · cos(35°) = 81,9%
    </text>
    <text x="132" y="120" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#475569">
      Sling IWRC SS304 Ø20mm (SF 1,77)
    </text>

    <g font-family="ui-monospace, monospace" font-size="10.5" fill="#334155" font-weight="600">
      <text x="22" y="152">• Bentangan Boom: <tspan fill="#047857" font-weight="800">1,4 km PE-PU</tspan></text>
      <text x="22" y="174">• Transpor Pasif: <tspan fill="#047857" font-weight="800">81,9% Arus</tspan></text>
      <text x="22" y="196">• Ekstraksi Darat: <tspan fill="#b45309" font-weight="800">Conveyor/Excav</tspan></text>
      <text x="22" y="218">• Biomassa Basah: <tspan fill="#0f172a" font-weight="800">320 Ton/hr</tspan></text>
      <text x="22" y="240">• Dewatering Cacah: <tspan fill="#0369a1" font-weight="800">Reduksi Air 85%</tspan></text>
      <text x="22" y="264" fill="#047857" font-weight="900">→ Hemat OPEX BBM Alat Berat</text>
    </g>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="589" y1="258" x2="612" y2="258" stroke="#059669" stroke-width="4" marker-end="url(#flowArrowEmerald)" />

  <!-- STAGE 3: Bio-Fermentasi Pelet Pakan 100.000 KJA (Modul 4A) -->
  <g transform="translate(616, 114)">
    <rect width="265" height="288" rx="14" fill="#ffffff" stroke="#d97706" stroke-width="2" />
    <rect x="16" y="16" width="233" height="32" rx="6" fill="#fef3c7" />
    <text x="132" y="36" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11.5" font-weight="900" fill="#92400e">
      TAHAP 3 • BIO-FERMENTASI KJA
    </text>
    <text x="132" y="70" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#0f172a">
      Pabrik Pelet Pakan Sirkular
    </text>
    <rect x="18" y="84" width="229" height="44" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
    <text x="132" y="103" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" font-weight="800" fill="#b45309">
      P_pelet = 3,0 Ton/ha · H(t)
    </text>
    <text x="132" y="120" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#475569">
      Hidrolisis Selulosa + Probiotik
    </text>

    <g font-family="ui-monospace, monospace" font-size="10.5" fill="#334155" font-weight="600">
      <text x="22" y="152">• Output Pelet: <tspan fill="#b45309" font-weight="800">48,0 Ton/hari</tspan></text>
      <text x="22" y="174">• Kemasan Karung: <tspan fill="#b45309" font-weight="800">960 Sak @50kg</tspan></text>
      <text x="22" y="196">• Kadar Protein: <tspan fill="#047857" font-weight="800">32,5% – 35,8%</tspan></text>
      <text x="22" y="218">• Target Suplai: <tspan fill="#0f172a" font-weight="800">100.000 KJA</tspan></text>
      <text x="22" y="240">• Harga Sirkular: <tspan fill="#047857" font-weight="800">Rp4.500 / kg</tspan></text>
      <text x="22" y="264" fill="#b45309" font-weight="900">→ Hemat 52,6% vs Pakan Apung</text>
    </g>
  </g>

  <!-- Arrow 3 -> 4 -->
  <line x1="883" y1="258" x2="906" y2="258" stroke="#d97706" stroke-width="4" marker-end="url(#flowArrowAmber)" />

  <!-- STAGE 4: Pemulihan Baku Mutu Air & Proteksi PLTA (Modul 4B) -->
  <g transform="translate(910, 114)">
    <rect width="262" height="288" rx="14" fill="#ffffff" stroke="#059669" stroke-width="2" />
    <rect x="16" y="16" width="230" height="32" rx="6" fill="#d1fae5" />
    <text x="131" y="36" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11.5" font-weight="900" fill="#065f46">
      TAHAP 4 • EKOLOGI &amp; PLTA
    </text>
    <text x="131" y="70" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#0f172a">
      Baku Mutu Air &amp; Zero Loss
    </text>
    <rect x="18" y="84" width="226" height="44" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
    <text x="131" y="103" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" font-weight="800" fill="#047857">
      PP No. 22/2021 Kelas IV
    </text>
    <text x="131" y="120" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#475569">
      Pemulihan Oksigen Terlarut (DO)
    </text>

    <g font-family="ui-monospace, monospace" font-size="10.5" fill="#334155" font-weight="600">
      <text x="20" y="152">• Serapan Total N: <tspan fill="#0369a1" font-weight="800">1,0 mg/L (72 kg/hr)</tspan></text>
      <text x="20" y="174">• Serapan Total P: <tspan fill="#0369a1" font-weight="800">0,24 mg/L (17 kg/hr)</tspan></text>
      <text x="20" y="196">• Pemulihan DO: <tspan fill="#047857" font-weight="800">2,0 → 2,65 mg/L</tspan></text>
      <text x="20" y="218">• Sulfida H₂S: <tspan fill="#047857" font-weight="800">0,005 → &lt;0,002</tspan></text>
      <text x="20" y="240">• Avoided Loss: <tspan fill="#b45309" font-weight="800">Rp17,07 Jt/jam</tspan></text>
      <text x="20" y="264" fill="#047857" font-weight="900">→ Proteksi Rp409,8 Jt/hr/unit</text>
    </g>
  </g>

  <!-- ======================================================================= -->
  <!-- BOTTOM PANEL: SPATIO-TEMPORAL GRAPH & PP 22/2021 WATER QUALITY TABLE     -->
  <!-- ======================================================================= -->

  <!-- Bottom-Left: 60-Day Weed Coverage Trajectory Graph (White Card) -->
  <g transform="translate(28, 424)">
    <rect width="560" height="304" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <text x="28" y="34" font-family="ui-monospace, monospace" font-size="12" font-weight="800" fill="#047857">
      TRAJEKTORI LUAS TUTUPAN ECENG GONDOK A(t) SELAMA 60 HARI (A₀ = 430 HA)
    </text>

    <!-- Graph Background -->
    <rect x="65" y="54" width="460" height="191" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />

    <!-- Graph Axes -->
    <line x1="65" y1="245" x2="525" y2="245" stroke="#64748b" stroke-width="2" />
    <line x1="65" y1="54" x2="65" y2="245" stroke="#64748b" stroke-width="2" />

    <!-- Y-Axis Labels -->
    <g font-family="ui-monospace, monospace" font-size="10" fill="#475569" font-weight="700" text-anchor="end">
      <text x="56" y="75">800 ha</text>
      <text x="56" y="135">430 ha</text>
      <text x="56" y="195">250 ha</text>
      <text x="56" y="245">0 ha</text>
    </g>

    <!-- Baseline Grid Line at A0 = 430 ha -->
    <line x1="65" y1="132" x2="525" y2="132" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 5" />

    <!-- Red Curve: Net Accumulation (H <= 12,9 ha/hari) -->
    <path d="M 65 132 Q 260 105, 515 64" stroke="#e11d48" stroke-width="4" fill="none" />
    <text x="305" y="78" font-family="ui-monospace, monospace" font-size="10.5" font-weight="800" fill="#be123c">
      Eksisting (H &lt; 12,9 ha/hr): Net Accumulation (Merah)
    </text>

    <!-- Green Curve: CIRATA-SENSE Controlled Reduction (H = 16,0 ha/hari -> -3,1 ha/hari) -->
    <path d="M 65 132 L 515 198" stroke="#059669" stroke-width="4.5" fill="none" />
    <circle cx="65" cy="132" r="5.5" fill="#d97706" />
    <circle cx="290" cy="165" r="5.5" fill="#059669" />
    <circle cx="515" cy="198" r="5.5" fill="#059669" />
    <text x="175" y="222" font-family="ui-monospace, monospace" font-size="11" font-weight="900" fill="#047857">
      CIRATA-SENSE (H = 16,0 ha/hr): Turun ke 244 ha (-186 ha / 60 hr)
    </text>

    <!-- X-Axis Labels -->
    <g font-family="ui-monospace, monospace" font-size="10" fill="#475569" font-weight="700" text-anchor="middle">
      <text x="65" y="268">Hari ke-0 (430 ha)</text>
      <text x="290" y="268">Hari ke-30 (337 ha)</text>
      <text x="495" y="268">Hari ke-60 (244 ha)</text>
    </g>
  </g>

  <!-- Bottom-Right: PP 22/2021 Class IV Water Quality & Circular Economy Impact (White Card) -->
  <g transform="translate(612, 424)">
    <rect width="560" height="304" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <text x="28" y="34" font-family="ui-monospace, monospace" font-size="12" font-weight="800" fill="#b45309">
      NERACA KUALITAS AIR (PP 22/2021 KELAS IV) &amp; VALUASI EKONOMI PLTA
    </text>

    <g font-family="ui-monospace, monospace" font-size="11">
      <rect x="24" y="48" width="512" height="28" rx="6" fill="#f1f5f9" />
      <text x="36" y="66" fill="#334155" font-weight="800">Parameter Uji Air / Ekonomi</text>
      <text x="255" y="66" fill="#be123c" font-weight="800">Baseline Eksisting</text>
      <text x="405" y="66" fill="#047857" font-weight="800">Pasca CIRATA-SENSE</text>

      <!-- Row 1 -->
      <text x="36" y="98" fill="#0f172a" font-weight="700">Oksigen Terlarut (DO)</text>
      <text x="255" y="98" fill="#b45309" font-weight="700">2,00 mg/L (Batas &gt;1)</text>
      <text x="405" y="98" fill="#047857" font-weight="800">2,65 mg/L (Optimal)</text>
      <line x1="24" y1="108" x2="536" y2="108" stroke="#e2e8f0" />

      <!-- Row 2 -->
      <text x="36" y="130" fill="#0f172a" font-weight="700">Total Nitrogen &amp; Fosfat</text>
      <text x="255" y="130" fill="#475569" font-weight="700">N 1,0 | P 0,24 mg/L</text>
      <text x="405" y="130" fill="#0369a1" font-weight="800">Terserap ke Pelet KJA</text>
      <line x1="24" y1="140" x2="536" y2="140" stroke="#e2e8f0" />

      <!-- Row 3 -->
      <text x="36" y="162" fill="#0f172a" font-weight="700">Sulfida Terlarut (H₂S)</text>
      <text x="255" y="162" fill="#be123c" font-weight="700">0,005 mg/L (Korosif)</text>
      <text x="405" y="162" fill="#047857" font-weight="800">&lt;0,002 mg/L + Isolasi</text>
      <line x1="24" y1="172" x2="536" y2="172" stroke="#e2e8f0" />

      <!-- Row 4 -->
      <text x="36" y="194" fill="#0f172a" font-weight="700">pH, Suhu, TDS, TSS, BOD</text>
      <text x="255" y="194" fill="#475569" font-weight="700">pH 7,1 | 29°C | BOD 5</text>
      <text x="405" y="194" fill="#047857" font-weight="800">100% Patuh Kelas IV</text>
      <line x1="24" y1="204" x2="536" y2="204" stroke="#e2e8f0" />

      <!-- Row 5: Avoided Downtime Loss Highlight -->
      <rect x="24" y="216" width="512" height="66" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5" />
      <text x="38" y="240" fill="#065f46" font-weight="800">PROTEKSI KERUGIAN DOWNTIME PLTA CIRATA &amp; REVENUE PAKAN KJA:</text>
      <text x="38" y="264" fill="#0f172a" font-weight="900" font-size="12">
        Avoided Loss: Rp17.074.290,072/jam/unit (Rp409,8 Jt/hr) + 48 Ton Pelet/hr
      </text>
    </g>
  </g>
</svg>
