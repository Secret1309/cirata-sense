<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 90" fill="none">
  <defs>
    <linearGradient id="eurPetal1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#facc15" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
    <linearGradient id="eurPetal2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
  </defs>

  <!-- 6-Petal Eureka! Starburst Pinwheel -->
  <g transform="translate(44, 44)">
    <g transform="rotate(0)">
      <path d="M0 -4 C10 -26, 26 -30, 18 -8 C14 0, 5 2, 0 -4 Z" fill="url(#eurPetal1)" />
    </g>
    <g transform="rotate(60)">
      <path d="M0 -4 C10 -26, 26 -30, 18 -8 C14 0, 5 2, 0 -4 Z" fill="url(#eurPetal2)" />
    </g>
    <g transform="rotate(120)">
      <path d="M0 -4 C10 -26, 26 -30, 18 -8 C14 0, 5 2, 0 -4 Z" fill="url(#eurPetal1)" />
    </g>
    <g transform="rotate(180)">
      <path d="M0 -4 C10 -26, 26 -30, 18 -8 C14 0, 5 2, 0 -4 Z" fill="url(#eurPetal2)" />
    </g>
    <g transform="rotate(240)">
      <path d="M0 -4 C10 -26, 26 -30, 18 -8 C14 0, 5 2, 0 -4 Z" fill="url(#eurPetal1)" />
    </g>
    <g transform="rotate(300)">
      <path d="M0 -4 C10 -26, 26 -30, 18 -8 C14 0, 5 2, 0 -4 Z" fill="url(#eurPetal2)" />
    </g>
    <circle cx="0" cy="0" r="4.5" fill="#fef08a" />
  </g>

  <!-- Eureka! ITB 2026 Typography -->
  <text x="86" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="27" font-weight="900" fill="#0f172a" letter-spacing="-0.5">
    Eureka<tspan fill="#ea580c">!</tspan>
  </text>
  <text x="87" y="66" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="800" fill="#334155" letter-spacing="0.5">
