  </text>
  <rect x="120" y="51" width="54" height="19" rx="4" fill="#0f172a" />
  <text x="147" y="65" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13.5" font-weight="900" fill="#facc15" letter-spacing="1">
    2026
  </text>
